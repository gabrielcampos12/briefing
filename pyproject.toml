[project]
name = "news-briefing"
version = "0.1.0"
description = "Personalized news briefings via Discord and e-mail (Agno, PostgreSQL)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "agno>=2.0.0",
    "groq>=0.10.0",
    "discord.py>=2.3.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "feedparser>=6.0.0",
    "greenlet>=3.0.0",
    "tzdata>=2024.0",
    "pydantic>=2.0.0",
]
[project.optional-dependencies]
dev = ["ruff>=0.4.0", "mypy>=1.8.0"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/news_briefing"]
[tool.hatch.build.targets.sdist]
include = ["src/news_briefing", "README.md", "pyproject.toml"]
[tool.ruff]
line-length = 100
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
